[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "toolschema"
version = "0.1.0"
description = "Semantics-preserving tool-schema transformations for evaluating LLM agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "CC-BY-4.0"}
dependencies = ["openai>=1.0", "aiohttp>=3.9"]

[tool.setuptools.packages.find]
include = ["toolschema*"]
